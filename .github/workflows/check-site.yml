name: Validate Abel Automation V6 PRO
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preserved legacy website
        run: node scripts/check-site.mjs
      - name: Validate V6 PRO project and calculator
        run: node scripts/check-v6.mjs
